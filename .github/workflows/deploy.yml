name: Deploy Backend

on:
  push:
    branches:
      - API_dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: vosvod server

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.INPUT_PASSPHRASE }}
          script: |
            cd /home/vosvod/journal
            git pull origin API_dev
            sudo systemctl restart vosvod